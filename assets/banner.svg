<svg width="1500" height="540" viewBox="0 0 1500 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1217"/>
      <stop offset="50%" stop-color="#06090d"/>
      <stop offset="100%" stop-color="#020406"/>
    </linearGradient>

    <!-- Harmonized Ambient Glow -->
    <radialGradient id="ambientGlow" cx="26%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#020406" stop-opacity="0"/>
    </radialGradient>

    <!-- Brand Icon Gradient -->
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="35%" stop-color="#2dd4bf"/>
      <stop offset="70%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Typography Gradient -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ccfbf1"/>
      <stop offset="65%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <!-- Laser Accent Line Gradient -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="20%" stop-color="#2dd4bf" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>

    <!-- High-Definition Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="textShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="techGrid" width="72" height="72" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3" fill="#2dd4bf" opacity="0.035"/>
    </pattern>
  </defs>

  <!-- FULL-BLEED BACKGROUND -->
  <rect width="1500" height="540" fill="url(#bgGrad)"/>
  <rect width="1500" height="540" fill="url(#ambientGlow)"/>
  <rect width="1500" height="540" fill="url(#techGrid)"/>

  <!-- SUBTLE FLOATING PARTICLE DOTS -->
  <g opacity="0.45">
    <circle cx="180" cy="120" r="4" fill="#2dd4bf" filter="url(#glow)" opacity="0.5"/>
    <circle cx="340" cy="420" r="3" fill="#38bdf8" opacity="0.3"/>
    <circle cx="250" cy="310" r="2" fill="#5eead4" opacity="0.4"/>
    
    <circle cx="1150" cy="100" r="5" fill="#99f6e4" filter="url(#glow)" opacity="0.4"/>
    <circle cx="1320" cy="380" r="3.5" fill="#2dd4bf" opacity="0.35"/>
    <circle cx="1020" cy="450" r="2.5" fill="#38bdf8" opacity="0.3"/>
    <circle cx="1400" cy="180" r="2" fill="#5eead4" opacity="0.5"/>
    
    <circle cx="600" cy="80" r="3" fill="#2dd4bf" opacity="0.35"/>
    <circle cx="900" cy="470" r="4" fill="#38bdf8" filter="url(#glow)" opacity="0.4"/>
  </g>

  <!-- BRAND ICON -->
  <g filter="url(#shadow)" transform="translate(-12, 0) scale(3)">
    <!-- Soft diffuse aura matching the icon contours -->
    <path d="M69 90 L85 98 L101 90 L85 82 Z" fill="#2dd4bf" opacity="0.2" filter="url(#softGlow)"/>

    <svg x="45" y="50" width="80" height="80" viewBox="0 0 48 48" fill="none">
      <!-- Base de arquivos organizados -->
      <path d="M6 32l18 9 18-9-18-9-18 9z" fill="url(#markGrad)" opacity="0.3"/>
      <path d="M6 24l18 9 18-9-18-9-18 9z" fill="url(#markGrad)" opacity="0.6"/>
      <path d="M6 16l18 9 18-9-18-9-18 9z" fill="url(#markGrad)" stroke="#99f6e4" stroke-width="0.75" filter="url(#glow)"/>
      <!-- Ponto central de sincronização -->
      <circle cx="24" cy="25" r="3" fill="#030507"/>
      <circle cx="24" cy="25" r="1.5" fill="#2dd4bf"/>
    </svg>
  </g>

  <!-- TYPOGRAPHY & LASER UNDERLINE -->
  <g transform="translate(885, 0) scale(3)">
    <g filter="url(#textShadow)">
      <text x="0" y="98"
            text-anchor="middle"
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-size="41"
            font-weight="800"
            letter-spacing="-1.2"
            fill="url(#textGrad)">
        DownLoadout
      </text>
    </g>

    <g opacity="0.95">
      <line x1="-115" y1="116" x2="115" y2="116" stroke="#2dd4bf" stroke-width="1.5" opacity="0.25"/>
      <line x1="-98" y1="116" x2="98" y2="116" stroke="url(#lineGrad)" stroke-width="2" filter="url(#glow)"/>
      <circle cx="98" cy="116" r="2.5" fill="#ffffff" filter="url(#glow)"/>
    </g>
  </g>

  <!-- TOP LIGHT ACCENTS -->
  <circle cx="225" cy="60" r="5.4" fill="#2dd4bf" opacity="0.4" filter="url(#glow)"/>
  <circle cx="1275" cy="60" r="5.4" fill="#38bdf8" opacity="0.4" filter="url(#glow)"/>
</svg>