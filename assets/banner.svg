<svg width="1500" height="540" viewBox="0 0 1500 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1217"/>
      <stop offset="50%" stop-color="#06090d"/>
      <stop offset="100%" stop-color="#020406"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="26%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#020406" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="35%" stop-color="#2dd4bf"/>
      <stop offset="70%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ccfbf1"/>
      <stop offset="65%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="20%" stop-color="#2dd4bf" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>

    <!-- Seamless Clean Glow with wide boundary to prevent square clipping -->
    <filter id="iconGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="iconShadow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <filter id="textShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <pattern id="techGrid" width="72" height="72" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3" fill="#2dd4bf" opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1500" height="540" fill="url(#bgGrad)"/>
  <rect width="1500" height="540" fill="url(#ambientGlow)"/>
  <rect width="1500" height="540" fill="url(#techGrid)"/>

  <g opacity="0.45">
    <circle cx="180" cy="120" r="4" fill="#2dd4bf" opacity="0.5"/>
    <circle cx="340" cy="420" r="3" fill="#38bdf8" opacity="0.3"/>
    <circle cx="250" cy="310" r="2" fill="#5eead4" opacity="0.4"/>
    
    <circle cx="1150" cy="100" r="5" fill="#99f6e4" opacity="0.4"/>
    <circle cx="1320" cy="380" r="3.5" fill="#2dd4bf" opacity="0.35"/>
    <circle cx="1020" cy="450" r="2.5" fill="#38bdf8" opacity="0.3"/>
    <circle cx="1400" cy="180" r="2" fill="#5eead4" opacity="0.5"/>
    
    <circle cx="600" cy="80" r="3" fill="#2dd4bf" opacity="0.35"/>
    <circle cx="900" cy="470" r="4" fill="#38bdf8" opacity="0.4"/>
  </g>

  <!-- BRAND ICON: The exact 3 layers the user liked, floating with seamless glow and zero square borders -->
  <g filter="url(#iconShadow)" transform="translate(110, 135) scale(5.2)">
    <!-- Base layer -->
    <path d="M6 32l18 9 18-9-18-9-18 9z" fill="url(#markGrad)" opacity="0.3"/>
    <!-- Middle layer -->
    <path d="M6 24l18 9 18-9-18-9-18 9z" fill="url(#markGrad)" opacity="0.6"/>
    <!-- Top layer with subtle neon stroke and seamless glow -->
    <path d="M6 16l18 9 18-9-18-9-18 9z" fill="url(#markGrad)" stroke="#99f6e4" stroke-width="0.8" filter="url(#iconGlow)"/>
    <!-- Central sync dot -->
    <circle cx="24" cy="25" r="2.8" fill="#030507"/>
    <circle cx="24" cy="25" r="1.4" fill="#2dd4bf"/>
  </g>

  <!-- TYPOGRAPHY & LASER UNDERLINE -->
  <g transform="translate(710, 0) scale(3)">
    <g filter="url(#textShadow)">
      <text x="0" y="98"
            text-anchor="middle"
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-size="41"
            font-weight="800"
            letter-spacing="-1.2"
            fill="url(#textGrad)">
        DownTidy
      </text>
    </g>

    <g opacity="0.95">
      <line x1="-115" y1="116" x2="115" y2="116" stroke="#2dd4bf" stroke-width="1.5" opacity="0.25"/>
      <line x1="-98" y1="116" x2="98" y2="116" stroke="url(#lineGrad)" stroke-width="2"/>
      <circle cx="98" cy="116" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <circle cx="225" cy="60" r="5.4" fill="#2dd4bf" opacity="0.4"/>
  <circle cx="1275" cy="60" r="5.4" fill="#38bdf8" opacity="0.4"/>
</svg>
